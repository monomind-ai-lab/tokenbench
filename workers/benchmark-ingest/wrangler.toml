name = "tokenbench-benchmark-ingest"
account_id = "e9ac0943443affe2bd7b18971265deee"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# The scheduled handler only starts the singleton coordinator. Each SQLite
# Durable Object alarm performs one bounded checkpointed step.
[observability]
enabled = true

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "ai-plan-catalog"
database_id = "a80143b2-519b-4cf1-a153-0d38b3d1b053"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "SOURCE_SNAPSHOTS"
bucket_name = "ai-plan-catalog-snapshots"

[[durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "BenchmarkIngestCoordinator"

[exports.BenchmarkIngestCoordinator]
type = "durable-object"
storage = "sqlite"

[triggers]
# "20 1 13 8 *" is the temporary one-shot maintenance trigger (MAINTENANCE_FORCE_CRON
# in src/index.ts). It forces one cycle so the corrected price join re-materializes
# the api_response_cache rows that the ISO-week dedupe would otherwise block until
# 2026-W34. Remove this entry and redeploy once the forced cycle publishes.
#
# Must not overlap the catalog Worker's "20 0 * * *" cron: a benchmark cycle
# freezes the catalog revision at start and fails validation if it changes.
crons = ["15 2 * * SUN", "20 1 13 8 *"]
