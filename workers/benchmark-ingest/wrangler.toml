name = "tokenbench-benchmark-ingest"
account_id = "e9ac0943443affe2bd7b18971265deee"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# The scheduled handler only starts the singleton coordinator. Each SQLite
# Durable Object alarm performs one bounded checkpointed step.
[observability]
enabled = true

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "ai-plan-catalog"
database_id = "a80143b2-519b-4cf1-a153-0d38b3d1b053"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "SOURCE_SNAPSHOTS"
bucket_name = "ai-plan-catalog-snapshots"

[[durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "BenchmarkIngestCoordinator"

[exports.BenchmarkIngestCoordinator]
type = "durable-object"
storage = "sqlite"

[triggers]
# A one-shot maintenance trigger can be added here temporarily to force a
# re-materialization when a corrected derivation ships mid-week (the coordinator
# dedupes on an ISO-week cadence key). Such a trigger must not overlap the
# catalog Worker's "20 0 * * *" cron: a benchmark cycle freezes the catalog
# revision at start and fails validation if it changes mid-cycle.
#
# For derivation-only fixes prefer the cache-only republish path instead of a
# forced cycle: temporarily add BENCHMARK_CACHE_REPUBLISH_CRON ("*/5 * * * *")
# to this list, let one tick land, then remove it and redeploy triggers. It
# performs no upstream fetch and ignores the ISO-week dedupe. It cannot widen
# the ingested cohort or rewrite persisted normalized metric ranks; those still
# require a full cycle that publishes a new revision.
crons = ["15 2 * * SUN"]
