name = "tokenbench-benchmark-ingest"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# The scheduled handler only starts the singleton coordinator. Each SQLite
# Durable Object alarm performs one bounded checkpointed step.
[observability]
enabled = true

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "ai-plan-catalog"
database_id = "a80143b2-519b-4cf1-a153-0d38b3d1b053"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "SOURCE_SNAPSHOTS"
bucket_name = "ai-plan-catalog-snapshots"

[[durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "BenchmarkIngestCoordinator"

[exports.BenchmarkIngestCoordinator]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["15 2 * * SUN"]
